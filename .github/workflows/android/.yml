
name: Build 7D Android App

on:
  workflow_dispatch:
  push:
    paths:
      - "7D_Android_App.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3 
      - name: Check ZIP file
        run: test -f 7D_Android_App.zip

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir source
          unzip -q 7D_Android_App.zip -d source
          test -f source/7D_Android_App/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          cd source/7D_Android_App
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 7D-Android-APK
          path: source/7D_Android_App/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
